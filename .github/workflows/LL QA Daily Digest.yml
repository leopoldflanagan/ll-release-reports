name: LL QA Daily Digest

on:
  schedule:
    - cron: "30 13,14,15,16 * * 1-5"   # 8:30 & 10:30 CT (ambas estaciones)
    - cron: "0 19,20,23 * * 1-5"       # 14:00 CT (ambas) + 18:00 CDT
    - cron: "0 0 * * 2-6"              # 18:00 CST (medianoche UTC del día siguiente)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post digest to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DIGEST_GUARD: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python3 scripts/digest_post.py qa-roadmap/data.json
