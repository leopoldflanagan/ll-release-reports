name: LL QA Daily Digest

on:
  schedule:
    - cron: "30 12,13,14,15 * * 1-5"
    - cron: "0 18,19,22,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post digest to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DIGEST_GUARD: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python3 scripts/digest_post.py qa-roadmap/data.json
